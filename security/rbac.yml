apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-account
  namespace: todoapp

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role
  namespace: todoapp
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]

---


apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: role-binding
  namespace: todoapp
subjects:
- kind: ServiceAccount
  name: service-account
  namespace: todoapp
roleRef:
  kind: Role
  name: role
  apiGroup: rbac.authorization.k8s.io