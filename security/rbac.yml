apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-lister
  namespace: todoapp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-lister
  namespace: todoapp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-lister-binding
  namespace: todoapp
roleRef:
  kind: Role
  name: secrets-lister
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: secrets-lister
    namespace: todoapp
