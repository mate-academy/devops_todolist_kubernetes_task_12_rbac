apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: todoapp
  name: secrets-reader

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: todoapp
  name: secret-reader
rules:
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [list]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: todoapp
  name: secret-reader-binding
subjects:
  - kind: ServiceAccount
    name: secrets-reader
    namespace: todoapp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader