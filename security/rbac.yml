apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
  namespace: todoapp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: todoapp
  name: secrets-lister
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-reader-binding
  namespace: todoapp
subjects:
- kind: ServiceAccount
  namespace: todoapp
  name: secrets-reader
roleRef:
  kind: Role
  name: secrets-lister
  apiGroup: rbac.authorization.k8s.io

