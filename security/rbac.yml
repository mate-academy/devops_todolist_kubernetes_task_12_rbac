kind: ServiceAccount
apiVersion: v1
metadata:
  name: secrets-reader
  namespace: todoapp

---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: secrets-reader
  namespace: todoapp
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]

---

kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: secrets-reader-binding
  namespace: todoapp
subjects:
- kind: ServiceAccount
  name: secrets-reader
roleRef:
  kind: Role
  name: secrets-reader
  apiGroup: rbac.authorization.k8s.io