kind: ServiceAccount
apiVersion: v1
metadata:
 name: secrets-reader
 namespace: mateapp

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
 namespace: mateapp # This is the namespace where the role will be created
 name: secret-reader # This is the name of the role
rules:
- apiGroups: [""] # "" indicates the core API group, which includes all core APIs
 resources: ["secrets"] # Indicates the resources that the role can access, in this case, pods
 verbs: ["list", "get", "wath"] # Indicates the actions that the role can perform on the resources

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
 name: secret-reader # This is the name of the role binding
 namespace: mateapp # This is the namespace where the role binding will be created
subjects:
- kind: ServiceAccount # Indicates that the subject is a service account
 name: secrets-reader # This is the name of the service account
roleRef:
