apiVersion: v1
kind: ServiceAccount
metadata:
  name: rbac-sa
  namespace: todoapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rbac-role
  namespace: todoapp
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rbac-rolebinding
  namespace: todoapp
subjects:
- kind: ServiceAccount
  name: rbac-sa
  namespace: todoapp
roleRef:
  kind: Role
  name: rbac-role
  apiGroup: rbac.authorization.k8s.io
