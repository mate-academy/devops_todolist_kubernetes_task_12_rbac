apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-listener
  namespace: todoapp

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-secret-lister
  namespace: todoapp
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-secret-lister-binding
  namespace: todoapp
subjects:
- kind: ServiceAccount
  name: secrets-listener
  namespace: todoapp
roleRef:
  kind: Role
  name: pod-secret-lister
  apiGroup: rbac.authorization.k8s.io