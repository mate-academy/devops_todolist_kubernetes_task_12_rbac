apiVersion: v1
kind: ServiceAccount
metadata:
 name: todoapp-sa
 namespace: todoapp

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todoapp-role
  namespace: todoapp
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todoapp-rolebinding
  namespace: todoapp
subjects:
- kind: ServiceAccount
  name: todoapp-sa
  namespace: todoapp
roleRef:
  kind: Role
  name: todoapp-role
  apiGroup: rbac.authorization.k8s.io
