apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-listener
  namespace: todoapp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: todoapp
  name: secrets-listener
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-listener-binding
  namespace: todoapp
subjects:
  - kind: ServiceAccount
    name: secrets-listener
roleRef:
  kind: Role
  name: secrets-listener
  apiGroup: rbac.authorization.k8s.io
