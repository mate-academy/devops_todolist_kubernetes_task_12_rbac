kind: ServiceAccount
apiVersion: v1
metadata:
 name: sa-listener
 namespace: todoapp

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
 namespace: todoapp
 name: sa-listener-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list", "get", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
 name: sa-listener-binding
 namespace: todoapp
subjects:
- kind: ServiceAccount
  name: sa-listener
roleRef:
  kind: Role
  name: sa-listener-role
  apiGroup: rbac.authorization.k8s.io

---