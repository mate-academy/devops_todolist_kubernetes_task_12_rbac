apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-listener
  namespace: todoapp

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-listener
  namespace: todoapp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-listener-binding
  namespace: todoapp
subjects:
  - kind: ServiceAccount
    name: secret-listener
roleRef:
    kind: Role
    name: secret-listener
    apiGroup: rbac.authorization.k8s.io