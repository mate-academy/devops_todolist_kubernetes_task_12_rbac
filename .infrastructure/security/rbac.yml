apiVersion: v1
kind: ServiceAccount
metadata:
  name: pods-lister
  namespace: todoapp

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: todoapp
  name: secrets-lister
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "get"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: todoapp
  name: secrets-lister-binding
subjects:
  - kind: ServiceAccount
    name: pods-lister
    namespace: todoapp
roleRef:
  kind: Role
  name: secrets-lister
  apiGroup: rbac.authorization.k8s.io
