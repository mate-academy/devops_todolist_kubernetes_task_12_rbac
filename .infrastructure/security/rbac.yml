kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: todoapp-secrets-ls-only
  namespace: todoapp
rules:
  - apiGroups: [""]
    resources:  ["secrets"]
    verbs: ["list"]

---

kind: ServiceAccount
apiVersion: v1
metadata:
  name: todoapp-sa
  namespace: todoapp

---
# RoleBinding

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todoapp-secret-ls-only-binding
  namespace: todoapp
subjects:
  - kind: ServiceAccount
    name: todoapp-sa
    namespace: todoapp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: todoapp-secrets-ls-only
