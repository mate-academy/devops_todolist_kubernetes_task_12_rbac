kind: ServiceAccount
apiVersion: v1
metadata:
  name: secrets-reader
  namespace: todoapp

---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
 namespace: todoapp
 name: secrets-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
 name: secrets-reader-binding # This is the name of the role binding
 namespace: todoapp # This is the namespace where the role binding will be created
subjects:
- kind: ServiceAccount # Indicates that the subject is a service account
  name: secrets-reader # This is the name of the service account
roleRef:
  kind: Role
  name: secrets-reader
  apiGroup: rbac.authorization.k8s.io