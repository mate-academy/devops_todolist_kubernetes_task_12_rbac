apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
  namespace: todoapp
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-lister
  namespace: todoapp
rules:
  - verbs: [ "list", "get" ] # Indicates the actions that the role can perform on the resources
    apiGroups: [ "" ] # "" indicates the core API group, which includes all core APIs
    resources: [ "secrets" ] # Indicates the resources that the role can access, in this case, secrets

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-lister-binding
  namespace: todoapp
subjects:
  - kind: ServiceAccount # Indicates that the subject is a service account
    name: secrets-reader # This is the name of the service account
roleRef:
  kind: Role # Indicates the kind of the role that the role binding will reference
  name: secret-lister # This is the name of the role
  apiGroup: rbac.authorization.k8s.io
