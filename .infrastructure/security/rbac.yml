apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-sa
  namespace: mateapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: mateapp
rules:
- apiGroups: [""] # Core API group
  resources: ["secrets"]
  verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-secrets-binding
  namespace: mateapp
subjects:
- kind: ServiceAccount
  name: todo-sa
  namespace: mateapp
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io