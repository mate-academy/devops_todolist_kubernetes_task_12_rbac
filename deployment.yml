---
# Deployment для Django TodoList приложения с использованием ServiceAccount
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-deployment
  namespace: default
  labels:
    app: todolist
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
        version: v1
    spec:
      serviceAccountName: todolist-service-account # Используем созданный ServiceAccount
      containers:
        - name: todolist-app
          image: python:3.9-slim
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DEBUG
              value: "False"
            - name: DJANGO_SETTINGS_MODULE
              value: "todolist.settings"
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: ["/bin/bash"]
          args:
            - "-c"
            - |
              apt-get update && apt-get install -y curl && \
              pip install -r /app/requirements.txt && \
              cd /app && \
              python manage.py migrate && \
              python manage.py runserver 0.0.0.0:8000
          volumeMounts:
            - name: app-source
              mountPath: /app
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Добавляем дополнительный контейнер для демонстрации доступа к secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
        - name: secrets-reader
          image: curlimages/curl:latest
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              echo "Secrets reader sidecar container started"
              # Бесконечный цикл для поддержания контейнера в рабочем состоянии
              while true; do
                echo "Listing secrets using Kubernetes API..."
                # Используем service account token для доступа к API
                TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
                
                echo "Attempting to list secrets in namespace: $NAMESPACE"
                curl -s --cacert $CACERT \
                     -H "Authorization: Bearer $TOKEN" \
                     "https://kubernetes.default.svc.cluster.local/api/v1/namespaces/$NAMESPACE/secrets" \
                     | head -20
                
                echo "Sleeping for 300 seconds..."
                sleep 300
              done
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: app-source
          configMap:
            name: todolist-source
      restartPolicy: Always

---
# ConfigMap с исходным кодом приложения (для демонстрации)
apiVersion: v1
kind: ConfigMap
metadata:
  name: todolist-source
  namespace: default
  labels:
    app: todolist
data:
  requirements.txt: |
    Django>=4.0
    djangorestframework
  manage.py: |
    #!/usr/bin/env python
    import os
    import sys

    if __name__ == "__main__":
        os.environ.setdefault("DJANGO_SETTINGS_MODULE", "todolist.settings")
        try:
            from django.core.management import execute_from_command_line
        except ImportError:
            raise ImportError("Django is not installed or not in PATH")
        execute_from_command_line(sys.argv)

---
# Service для доступа к приложению
apiVersion: v1
kind: Service
metadata:
  name: todolist-service
  namespace: default
  labels:
    app: todolist
spec:
  selector:
    app: todolist
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
